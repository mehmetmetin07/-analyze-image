services:
  - type: web
    name: image-analysis-api
    env: node
    region: frankfurt
    plan: starter
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
    healthCheckPath: /health
    autoDeploy: true
    numInstances: 1
    disk:
      name: uploads
      mountPath: /tmp
      sizeGB: 1 